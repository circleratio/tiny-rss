[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rss_reader"
dynamic = ["version"]
description = "Simple RSS reader for Windows (tkinter)"
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
rss-reader = "rss_reader.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "rss_reader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
